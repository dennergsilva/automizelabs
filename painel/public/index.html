<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Painel · Prospectos</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237c5cff'/%3E%3Cpath d='M8 22V10h4l4 8 4-8h4v12h-3v-7l-4 7h-2l-4-7v7z' fill='%23fff'/%3E%3C/svg%3E" />
<style>
  :root{--bg:#0f1115;--card:#1a1d24;--bd:#2a2e38;--mut:#8b92a0;--pri:#7c5cff;--ok:#22c55e;--warn:#f59e0b;--cyan:#34d3ff}
  *{margin:0;box-sizing:border-box;font-family:system-ui,sans-serif}
  body{background:var(--bg);color:#e8eaed}
  header{position:sticky;top:0;background:#0f1115ee;backdrop-filter:blur(8px);padding:14px 16px;border-bottom:1px solid var(--bd);z-index:5}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  h1{font-size:17px;font-weight:700}
  .tabs{display:flex;gap:6px}
  .tab{font-size:13px;padding:7px 16px;border-radius:9px;border:1px solid var(--bd);background:#1a1d24;color:var(--mut);cursor:pointer}
  .tab.on{background:var(--pri);color:#fff;border-color:var(--pri)}
  /* kanban */
  .board{display:flex;gap:12px;padding:16px;overflow-x:auto;min-height:78vh}
  .col{flex:0 0 270px;background:#13161c;border:1px solid var(--bd);border-radius:14px;padding:10px}
  .col h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);padding:4px 6px 10px;display:flex;justify-content:space-between}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
  .card .nm{font-weight:600;font-size:14px}
  .card .ci{font-size:12px;color:var(--mut);margin:2px 0 8px}
  .row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .btn{font-size:12px;padding:6px 10px;border-radius:8px;border:1px solid var(--bd);background:#222633;color:#e8eaed;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
  .btn.wa{background:#1f3d2f;border-color:#2e5c46;color:#7ee2a8}
  .btn.see{background:#262036;border-color:#3a2e5c;color:#c4b4ff}
  .btn.ig{background:#3a1f33;border-color:#6e2a55;color:#f0a8d6}
  .col.disc{border-color:#6e2a55}
  .col.disc h2{color:#f0a8d6}
  .col.nowpp{border-color:#3a3e48;opacity:.85}
  .col.nowpp h2{color:#8b92a0}
  .col.val{border-color:#1f6f4a}
  .col.val h2{color:#3ddc97}
  select,textarea{width:100%;background:#0f1218;border:1px solid var(--bd);color:#e8eaed;border-radius:8px;padding:6px;font-size:12px}
  textarea{margin-top:6px;resize:vertical;min-height:34px}
  /* metricas */
  .wrap{padding:18px 16px;max-width:1000px;margin:0 auto}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px}
  .kpi{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
  .kpi .lbl{font-size:12px;color:var(--mut);margin-bottom:6px}
  .kpi .val{font-size:26px;font-weight:700}
  .kpi .sub{font-size:11px;color:var(--mut);margin-top:2px}
  .panel{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:18px}
  .panel h3{font-size:14px;margin-bottom:16px;font-weight:600}
  .fstage{margin-bottom:12px}
  .fstage .fhead{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
  .fstage .fhead .conv{color:var(--cyan);font-size:11px}
  .ftrack{height:30px;background:#0f1218;border-radius:7px;overflow:hidden}
  .fbar{height:100%;border-radius:7px;display:flex;align-items:center;padding-left:10px;font-size:12px;font-weight:600;color:#0f1115;min-width:34px;transition:width .5s}
  .days{display:flex;align-items:flex-end;gap:5px;height:130px;padding-top:10px}
  .day{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
  .day .b{width:100%;background:linear-gradient(180deg,var(--pri),#5a3fd6);border-radius:4px 4px 0 0;min-height:2px;transition:height .5s}
  .day .n{font-size:9px;color:var(--mut)}
  .day .v{font-size:10px;color:#e8eaed}
  /* login */
  .login{max-width:320px;margin:18vh auto;padding:24px;background:var(--card);border:1px solid var(--bd);border-radius:16px;text-align:center}
  .login input{width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:#0f1218;color:#fff;margin:14px 0}
  .login button{width:100%;padding:11px;border-radius:10px;border:0;background:var(--pri);color:#fff;font-weight:600;cursor:pointer}
  .star{color:var(--warn)}
  /* prospecção por persona (Espanha) */
  .tags{align-items:center}
  .badge{font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid var(--bd);color:var(--mut);white-space:nowrap}
  .badge.eur{color:#7ee2a8;border-color:#2e5c46;font-weight:600}
  .badge.movil{color:#34d3ff;border-color:#1f4a5c}
  .badge.fijo{color:#f59e0b;border-color:#5c4a1f}
  select.per{width:auto;font-size:11px;padding:3px 6px;font-weight:600}
  select.per.P1{color:#f0a8d6;border-color:#6e2a55}
  select.per.P2{color:#c4b4ff;border-color:#3a2e5c}
  select.per.P3{color:#34d3ff;border-color:#1f4a5c}
  textarea.gancho{min-height:78px;font-style:italic;color:#d7dae0;margin-top:0;line-height:1.35}
  .flags{font-size:10px;color:var(--mut);margin:4px 0 8px;letter-spacing:.02em}
  .hint{font-size:11px;color:var(--mut);margin:-2px 0 8px;line-height:1.35}
  .btn.dis{opacity:.4;pointer-events:none}
  .btn.cp{padding:6px 8px}
  .btn.tel{background:#3d2f1f;border-color:#5c4a2e;color:#f5c77e}
  .chips{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .chip{font-size:11px;padding:4px 10px;border-radius:999px;border:1px solid var(--bd);color:var(--mut);cursor:pointer}
  .chip.on{background:#222633;color:#fff;border-color:#3a3e48}
</style>
</head>
<body>
<div id="app"></div>
<script>
const COLS = [
  ["descoberto","Descoberto"],["validado","Validado"],
  ["gerado","Gerado"],["sem_whatsapp","Sem WhatsApp"],["abordado","Abordado"],["respondeu","Respondeu"],
  ["negociando","Negociando"],["fechado","Fechado"],["perdido","Perdido"],
];
const FUNNEL = [["gerado","Gerado"],["abordado","Abordado"],["respondeu","Respondeu"],["negociando","Negociando"],["fechado","Fechado"]];
const IDX = {gerado:0,abordado:1,respondeu:2,negociando:3,fechado:4};
const COLOR = ["#7c5cff","#6457e0","#34d3ff","#f59e0b","#22c55e"];
// Espanha (2026-08-27): venda por ENTRADA ÚNICA, preço segue a persona. Sem mensalidade.
const PRECOS = { P1: 300, P2: 500, P3: 700 };
const PERSONAS = [["P1","P1 · Recién llegada"],["P2","P2 · Establecida"],["P3","P3 · Clínica con marca"]];
const basePersona = (p) => String(p||"").replace("?","");          // "P3?" (não confirmada) -> "P3"
// +34: móvil começa por 6 ou 71–79; fixo por 8/9. Fixo não recebe WhatsApp -> ligar.
function tipoTel(num){ const d=String(num||"").replace(/\D/g,""); if(!d.startsWith("34")) return null; const n=d.slice(2); return /^(6|7[1-9])/.test(n) ? "movil" : "fijo"; }
// Nome da médica a partir do nome do Maps: "Dra. Elena Berezo | Medicina Estética" -> Dra. / Elena / Berezo.
const PARA_NOMES = /^(medicina|est[eé]tica|est[eé]tico|cl[ií]nica|cl[ií]nicas|cirug[ií]a|cirujan[oa]|madrid|centro|m[eé]dic[oa]|especialista|dermat[oó]log[oa]|l[aá]ser|capilar|facial|y|e|de|del|la|el|en|&|tratamientos?|medicina)$/i;
const titulo = (s) => s.split(/\s+/).map(w => w.length>2 && w===w.toUpperCase() ? w[0]+w.slice(1).toLowerCase() : w).join(" ");
function nombres(p){
  const nome = String(p.nome||"").replace(/\s+/g," ").trim();
  // nome curto da clínica: 1º trecho antes de | · - :, sem os genéricos do fim
  // ("BeLift Medicina Estética Madrid" -> "BeLift"; "Clínica Carballo" fica).
  const cl = nome.split(/\s*[|·\-–—:]\s*/)[0].replace(/\.$/,"").split(/\s+/);
  while(cl.length>1 && PARA_NOMES.test(cl[cl.length-1].replace(/[.,]/g,""))) cl.pop();
  const clinica = titulo(cl.join(" "));
  const m = nome.match(/(^|[^A-Za-z])(Dra|Dr|Dres|Doctora|Doctor)\.?\s+(.+)$/i);
  if(!m) return { tratamiento:null, primero:null, apellido:null, clinica };
  const t = m[2].toLowerCase(); const tratamiento = t.startsWith("dra")||t==="doctora" ? "Dra." : t==="dres" ? "Dres." : "Dr.";
  const tokens = []; for(const w of m[3].split(/\s*[|·\-–—:,(]\s*|\.\s+/)[0].split(/\s+/)){ if(PARA_NOMES.test(w.replace(/[.,]/g,""))) break; tokens.push(w.replace(/[.,]$/,"")); }
  const primero = tokens[0] ? titulo(tokens[0]) : null;
  // 2 tokens é ambíguo ("Elena Berezo" vs "Fernández Palacios"): usa os dois — formal,
  // nunca errado. 3+ tokens: nome + dois apelidos -> os dois últimos.
  const apellido = tokens.length>=3 ? titulo(tokens.slice(-2).join(" ")) : tokens.length ? titulo(tokens.join(" ")) : null;
  return { tratamiento, primero, apellido, clinica };
}
// As duas mensagens (dois tempos): a 1ª pede permissão para mandar o link — o "sí"
// torna o envio solicitado (LSSI art. 21.1). A 2ª só existe quando a demo existe.
// Castelhano peninsular; a Tainá revisa antes de enviar. O gancho vem do radar.
function mensajes(p){
  const per = basePersona(p.persona) || "P2";
  const precio = p.preco || PRECOS[per];
  const n = nombres(p);
  const gan = (p.gancho||"").trim();
  // o radar escreve o gancho em "tu" (P1) ou "usted" (resto); P3 fala em "vosotros"
  const g = !gan ? "" : (per==="P3" ? gan.replace(/^Su web/,"Vuestra web").replace(/ (de |en )su web/g," $1vuestra web").replace(/a la doctora/,"al equipo") : gan) + " ";
  const enlace = p.preview_url || "[enlace de la demo — genera el sitio primero]";
  if(per==="P1") return {
    m1: `Hola, ${n.primero || "equipo de "+n.clinica} 👋 Soy Tainá, de AutomizeLabs. ${g}Te he preparado una web de demostración con tus datos, sin coste y sin compromiso. ¿Te paso el enlace?`,
    m2: `Aquí la tienes 👇\n${enlace}\n\nLa hice como demostración: las fotos son ejemplos que se cambian por las tuyas, y ya va sin nombrar medicamentos y con hueco para tu nº de colegiado y el registro sanitario, como pide Sanidad de Madrid.\n\nSi te gusta, te la dejo publicada y funcionando en 24h. Pago único de ${precio} €, la web es tuya, sin mensualidades. ¿La dejamos lista?`,
  };
  if(per==="P3") return {
    m1: `Hola, equipo de ${n.clinica}. Soy Tainá, de AutomizeLabs. ${g}Hemos preparado una demostración de web para ${n.clinica}, pensada para generar citas de forma previsible y conforme a la normativa sanitaria. ¿Con quién lo veo — contigo o con quien lleve la web?`,
    m2: `Aquí la tenéis 👇\n${enlace}\n\nLas imágenes son ejemplos editables; va sin nombrar medicamentos y con el registro sanitario y los colegiados en el pie. Si os encaja, la dejo publicada y funcionando en 24h. Pago único de ${precio} €, sin mensualidades. ¿Lo vemos con quien lleve las decisiones?`,
  };
  return {
    m1: `Buenos días, ${n.tratamiento ? n.tratamiento+" "+n.apellido : "equipo de "+n.clinica}. Soy Tainá, de AutomizeLabs. ${g}He preparado una versión de demostración de su web, ya adaptada a la normativa de publicidad sanitaria de Madrid, para que la compare con la actual. ¿Se la envío?`,
    m2: `Aquí la tiene 👇\n${enlace}\n\nEs una demostración con su información; las fotos son ejemplos que se cambian por las suyas. Va sin nombrar medicamentos y con el nº de colegiado y el registro CS en el pie — justo lo que Sanidad está revisando este año. Hoy el paciente decide si confía ya en la web, antes de la primera cita.\n\nSi le gusta, se la dejo publicada en 24h. Pago único de ${precio} €, la web es suya, sin mensualidades. ¿La dejamos lista?`,
  };
}
const LLAMADA = "Hola, buenos días. Soy Tainá, de AutomizeLabs. ¿Me puede pasar el WhatsApp de la doctora o de quien lleve la web? Le hemos preparado una demostración y me gustaría enviársela.";
const MSGS = {};
// Acesso por link: /?k=SENHA entra direto, sem tela de login. A chave vai pro
// localStorage e some da barra de endereço, então basta salvar o link uma vez.
const _k = new URLSearchParams(location.search).get("k");
if(_k){ localStorage.setItem("painel_senha", _k); history.replaceState(null, "", location.pathname); }
let senha = localStorage.getItem("painel_senha") || "";
let view = localStorage.getItem("painel_view") || "funil";
let DATA = [];
const api = (p, opt={}) => fetch("/api"+p, {...opt, headers:{"Content-Type":"application/json","x-senha":senha, ...(opt.headers||{})}});
const esc = (s)=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function login(){
  document.getElementById("app").innerHTML = `<div class="login"><h1>Painel de Prospectos</h1>
    <input id="s" type="password" placeholder="Senha" onkeydown="if(event.key==='Enter')setSenha()" />
    <button onclick="setSenha()">Entrar</button></div>`;
}
function setSenha(){ senha=document.getElementById("s").value; localStorage.setItem("painel_senha",senha); load(); }
let filtro = "";
let filtroPersona = localStorage.getItem("painel_persona") || "";
function setPersonaFiltro(v){ filtroPersona=v; localStorage.setItem("painel_persona",v); render(); }
function setView(v){ view=v; localStorage.setItem("painel_view",v); render(); }
function setFiltro(v){ filtro=v; render(); const b=document.getElementById("busca"); if(b){ b.focus(); b.setSelectionRange(b.value.length,b.value.length); } }

async function load(){
  const r = await api("/prospectos");
  // chave errada/velha: descarta pra não ficar preso num loop de 401
  if(r.status===401){ localStorage.removeItem("painel_senha"); senha=""; login(); return; }
  DATA = await r.json();
  render();
}

function header(){
  return `<header><div class="top">
    <h1>Painel de Prospectos</h1>
    <div class="tabs">
      <div class="tab ${view==='funil'?'on':''}" onclick="setView('funil')">Funil</div>
      <div class="tab ${view==='metricas'?'on':''}" onclick="setView('metricas')">Métricas</div>
    </div>
  </div>${view==='funil'?`<input id="busca" placeholder="Buscar por nome..." value="${esc(filtro)}" oninput="setFiltro(this.value)" style="width:100%;max-width:340px;margin-top:10px;padding:8px 12px;border-radius:9px;border:1px solid var(--bd);background:#1a1d24;color:#e8eaed;font-size:13px" />
  <div class="chips">${[["","Todas"],["P1","P1 · Recién llegada"],["P2","P2 · Establecida"],["P3","P3 · Clínica con marca"],["fijo","☎ só fixo (ligar)"]].map(([k,l])=>`<span class="chip ${filtroPersona===k?'on':''}" onclick="setPersonaFiltro('${k}')">${l}</span>`).join("")}</div>`:""}</header>`;
}

function render(){
  if(!senha){ login(); return; }
  document.getElementById("app").innerHTML = header() + (view==="funil" ? kanban() : metricas());
}

/* ---------- FUNIL (kanban) ---------- */
function card(p){
  if(p.persona || p.pais==="ES") return cardPersona(p);
  return cardBR(p);
}
// Card da prospecção por persona (Espanha). O que a Tainá faz aqui, nesta ordem:
// 1) confirma a persona (P3? = marca de clínica ainda não olhada) — o preço segue;
// 2) lê o gancho do radar e corrige o castelhano se precisar;
// 3) móvil: "1ª msg" abre o WhatsApp com a permissão pedida; quando ela diz sí e a
//    demo existe, "2ª msg" leva o link + preço. Fixo: liga e pede o WhatsApp.
function cardPersona(p){
  const num = String(p.whatsapp||"").replace(/\D/g,"");
  const tt = tipoTel(num);
  const per = basePersona(p.persona) || "P2";
  const naoConfirmada = String(p.persona||"").endsWith("?");
  const precio = p.preco || PRECOS[per];
  const m = mensajes(p); MSGS[p.id] = m;
  const wa = (t) => num ? "https://wa.me/"+num+"?text="+encodeURIComponent(t) : "#";
  const ig = p.instagram ? "https://instagram.com/"+String(p.instagram).replace(/^@/,"") : "";
  const opts = COLS.map(([k,l])=>`<option value="${k}" ${p.status===k?"selected":""}>${l}</option>`).join("");
  const pers = PERSONAS.map(([k,l])=>`<option value="${k}" ${per===k?"selected":""}>${l}${per===k&&naoConfirmada?" ?":""}</option>`).join("");
  const desde = p.site_desde ? `<span class="badge" title="registro do domínio / 1ª captura">web desde ${esc(String(p.site_desde).slice(0,4))}</span>` : "";
  return `<div class="card">
    <div class="nm">${esc(p.nome||"")}</div>
    <div class="ci">${esc(p.cidade||"")} ${p.nota_google?'· <span class="star">★</span>'+esc(p.nota_google):""} ${p.nicho&&p.nicho!=='salao'?'· '+esc(p.nicho):""}</div>
    <div class="row tags">
      <select class="per ${per}" title="${naoConfirmada?'Persona NÃO confirmada — abrir a web e decidir':'Persona'}" onchange="setPersona(${p.id},this.value)">${pers}</select>
      <span class="badge eur">€ ${precio}</span>
      ${tt?`<span class="badge ${tt}">${tt==="movil"?"📱 móvil":"☎ fixo"}</span>`:""}
      ${desde}
    </div>
    ${naoConfirmada?`<div class="hint">Persona não confirmada: nome de marca. Abra a web — uma médica só = P2, equipe/unidades = P3.</div>`:""}
    <textarea class="gancho" placeholder="Gancho (1ª línea, en castellano)…" onblur="setGancho(${p.id},this.value)">${esc(p.gancho||"")}</textarea>
    ${p.flags?`<div class="flags">radar: ${esc(String(p.flags).replace(/\s+/g," · "))}</div>`:'<div class="flags"></div>'}
    <div class="row">
      ${tt==="fijo"
        ? `<a class="btn tel" href="tel:+${num}">☎ Ligar</a><span class="btn cp" title="copiar roteiro da ligação" onclick="copiar(${p.id},'ll')">📋 roteiro</span>`
        : `<a class="btn wa ${num?'':'dis'}" href="${wa(m.m1)}" target="_blank" title="pede permissão para mandar o link">1ª msg</a><span class="btn cp" title="copiar 1ª mensagem" onclick="copiar(${p.id},'m1')">📋</span>
           <a class="btn wa ${num&&p.preview_url?'':'dis'}" href="${wa(m.m2)}" target="_blank" title="${p.preview_url?'link da demo + preço':'gere a demo primeiro'}">2ª msg</a><span class="btn cp ${p.preview_url?'':'dis'}" title="copiar 2ª mensagem" onclick="copiar(${p.id},'m2')">📋</span>`}
      ${p.website?`<a class="btn see" href="${esc(p.website)}" target="_blank" title="web atual da clínica">Web atual</a>`:""}
      ${p.preview_url?`<a class="btn see" href="${p.preview_url}" target="_blank">Ver demo</a>`:""}
      ${ig?`<a class="btn ig" href="${ig}" target="_blank">Instagram</a>`:""}
    </div>
    ${tt==="fijo"?`<div class="hint">Fixo não recebe WhatsApp: ligue e peça o WhatsApp da médica ou de quem cuida da web. Só então a 1ª msg.</div>`:""}
    <select onchange="mv(${p.id},this.value)">${opts}</select>
    <textarea placeholder="Observações..." onblur="obs(${p.id},this.value)">${esc(p.observacoes||"")}</textarea>
    <div style="text-align:right;margin-top:6px"><span onclick="del(${p.id})" style="font-size:11px;color:#e0708a;cursor:pointer">🗑 excluir cliente</span></div>
  </div>`;
}
async function setPersona(id, persona){
  const p = DATA.find(x=>x.id===id); const preco = PRECOS[persona];
  await api("/prospectos/"+id,{method:"PATCH",body:JSON.stringify({persona, preco})});
  if(p){ p.persona=persona; p.preco=preco; } render();
}
async function setGancho(id, gancho){ const p=DATA.find(x=>x.id===id); if(p) p.gancho=gancho; await api("/prospectos/"+id,{method:"PATCH",body:JSON.stringify({gancho})}); }
async function copiar(id, qual){
  const t = qual==="ll" ? LLAMADA : (MSGS[id]||{})[qual];
  if(!t) return;
  try{ await navigator.clipboard.writeText(t); }catch{ prompt("Copie:", t); }
}
// Card antigo (Brasil, pré-persona): mantido para os leads legados.
function cardBR(p){
  const num = String(p.whatsapp||"").replace(/\D/g,"");
  const msg = p.preview_url
    ? `Olá! Vim pelo site de vocês e gostaria de mais informações sobre os serviços.\n\nNa verdade, comecei assim de propósito: sou o Denner, da AutomizeLabs — essa é a mensagem que um cliente mandaria se vocês tivessem um site no ar.\n\nSegundo o Google, 76% de quem busca um serviço por perto visita o negócio em até 1 dia — e, sem site, quem recebe essa visita é o concorrente que aparece.\n\nPor isso preparei um modelo de cortesia do site de vocês, com as fotos e avaliações reais, para mostrar como ficaria:\n\n${p.preview_url}\n\nPode dar uma olhada e me dizer o que achou?`
    : `Olá! Sou o Denner, da AutomizeLabs. Encontrei vocês no Google e notei que ainda não têm um site próprio. Posso preparar um modelo de cortesia, com as fotos e avaliações reais de vocês, e te mostrar sem compromisso?`;
  const wa = num ? "https://wa.me/"+num+"?text="+encodeURIComponent(msg) : "#";
  const ig = p.instagram ? "https://instagram.com/"+String(p.instagram).replace(/^@/,"") : "";
  const opts = COLS.map(([k,l])=>`<option value="${k}" ${p.status===k?"selected":""}>${l}</option>`).join("");
  return `<div class="card">
    <div class="nm">${esc(p.nome||"")}</div>
    <div class="ci">${esc(p.cidade||"")} ${p.nota_google?'· <span class="star">★</span>'+esc(p.nota_google):""} ${p.nicho&&p.nicho!=='salao'?'· '+esc(p.nicho):""}</div>
    <div class="row">
      ${num?`<a class="btn wa" href="${wa}" target="_blank">WhatsApp</a>`:""}
      ${ig?`<a class="btn ig" href="${ig}" target="_blank">Instagram</a>`:""}
      ${p.preview_url?`<a class="btn see" href="${p.preview_url}" target="_blank">Ver site</a>`:""}
    </div>
    <select onchange="mv(${p.id},this.value)">${opts}</select>
    <textarea placeholder="Observações..." onblur="obs(${p.id},this.value)">${esc(p.observacoes||"")}</textarea>
    <div style="text-align:right;margin-top:6px"><span onclick="del(${p.id})" style="font-size:11px;color:#e0708a;cursor:pointer">🗑 excluir cliente</span></div>
  </div>`;
}
async function del(id){ if(!confirm("Excluir este cliente do CRM?\n\nO card sai agora. Os arquivos do site e o subdomínio são removidos do servidor no purge (excluir-cliente.mjs).")) return; await api("/prospectos/"+id,{method:"DELETE"}); load(); }
function kanban(){
  const f = filtro.trim().toLowerCase();
  const vis = DATA.filter(x => (!f || (x.nome||"").toLowerCase().includes(f))
    && (!filtroPersona || (filtroPersona==="fijo" ? tipoTel(x.whatsapp)==="fijo" : basePersona(x.persona)===filtroPersona)));
  // ordem de ataque dentro da coluna: P1 antes de P2 antes de P3, móvil antes de fixo,
  // depois o mais recente — o que dá para abordar hoje fica no topo.
  const ORD = { P1: 0, P2: 1, P3: 2 };
  vis.sort((a, b) => ((ORD[basePersona(a.persona)] ?? 3) - (ORD[basePersona(b.persona)] ?? 3))
    || ((tipoTel(a.whatsapp)==="fijo") - (tipoTel(b.whatsapp)==="fijo"))
    || String(b.atualizado_em||"").localeCompare(String(a.atualizado_em||"")));
  return `<div class="board">${COLS.map(([k,l])=>`<div class="col ${k==='descoberto'?'disc':''} ${k==='validado'?'val':''} ${k==='sem_whatsapp'?'nowpp':''}">
    <h2>${l}<span>${vis.filter(x=>x.status===k).length}</span></h2>
    ${vis.filter(x=>x.status===k).map(card).join("")}</div>`).join("")}</div>`;
}
async function mv(id,status){ await api("/prospectos/"+id,{method:"PATCH",body:JSON.stringify({status})}); load(); }
async function obs(id,observacoes){ await api("/prospectos/"+id,{method:"PATCH",body:JSON.stringify({observacoes})}); }

/* ---------- MÉTRICAS ---------- */
function metricas(){
  const rows=DATA, total=rows.length;
  const descobertos=rows.filter(r=>r.status==="descoberto").length;
  const validados=rows.filter(r=>r.status==="validado").length;
  const semWpp=rows.filter(r=>r.status==="sem_whatsapp").length;
  const fechado=rows.filter(r=>r.status==="fechado").length;
  const perdido=rows.filter(r=>r.status==="perdido").length;
  const noFunil=total-descobertos-validados-semWpp; // entraram no funil de fato (exclui pool, validados sem site e sem-whatsapp)
  // quanto do pool tem WhatsApp de verdade — mede a qualidade da fonte de leads
  const checados=validados+semWpp;
  const taxaWpp=checados?Math.round(validados/checados*100):0;
  const ativos=rows.filter(r=>r.status!=="perdido");
  const reached=(k)=>ativos.filter(r=>(IDX[r.status]??-1)>=IDX[k]).length;
  const pipeline=noFunil-fechado-perdido;          // em negociação ativa (exclui pool e finalizados)
  const taxaResp = reached("abordado") ? Math.round(reached("respondeu")/reached("abordado")*100) : 0;
  const taxaFech = noFunil ? Math.round(fechado/noFunil*100) : 0;
  const taxaPerda = noFunil ? Math.round(perdido/noFunil*100) : 0;
  // Espanha: venda por entrada única com preço por persona -> receita = soma dos fechados
  const receita = rows.filter(r=>r.status==="fechado").reduce((s,r)=>s+(Number(r.preco)||0),0);
  const nP = (k) => rows.filter(r=>r.status!=="perdido" && basePersona(r.persona)===k).length;

  const kpi=(lbl,val,sub,color)=>`<div class="kpi"><div class="lbl">${lbl}</div><div class="val" ${color?'style="color:'+color+'"':''}>${val}</div>${sub?'<div class="sub">'+sub+'</div>':''}</div>`;
  const kpis=`<div class="kpis">
    ${kpi("Descobertos",descobertos,"pool bruto (a validar)","#f0a8d6")}
    ${kpi("Validados",validados,"WhatsApp confirmado, site a gerar","#3ddc97")}
    ${kpi("Sem WhatsApp",semWpp,"número não existe ou linha fixa","#8b92a0")}
    ${kpi("WhatsApp válido",taxaWpp+"%","validados / checados","#3ddc97")}
    ${kpi("No funil",noFunil,"contatáveis → venda")}
    ${kpi("Em pipeline",pipeline,"em negociação ativa")}
    ${kpi("Taxa de resposta",taxaResp+"%","responderam / abordados","#34d3ff")}
    ${kpi("Taxa de fechamento",taxaFech+"%","fechados / no funil","#22c55e")}
    ${kpi("Receita (entrada única)","€ "+receita.toLocaleString("es-ES"),fechado+" venda(s) · ticket médio € "+(fechado?Math.round(receita/fechado):0),"#22c55e")}
    ${kpi("Personas no pool",`${nP("P1")} · ${nP("P2")} · ${nP("P3")}`,"P1 recién llegada · P2 establecida · P3 clínica","#c4b4ff")}
  </div>`;

  // Funil: reached por etapa, largura relativa ao topo (gerado)
  const base=reached("gerado")||1;
  let prev=null;
  const funil=FUNNEL.map(([k,l],i)=>{
    const c=reached(k); const w=Math.max(c/base*100,4);
    const conv=prev!==null && prev>0 ? Math.round(c/prev*100) : null; prev=c;
    return `<div class="fstage">
      <div class="fhead"><span>${l} · <b>${c}</b></span>${conv!==null?'<span class="conv">▼ '+conv+'% da etapa anterior</span>':''}</div>
      <div class="ftrack"><div class="fbar" style="width:${w}%;background:${COLOR[i]}">${c}</div></div>
    </div>`;
  }).join("");

  // Prospecção por dia (últimos 14 dias)
  const byDay={};
  rows.forEach(r=>{ const d=(r.criado_em||"").slice(0,10); if(d) byDay[d]=(byDay[d]||0)+1; });
  const days=[]; const today=new Date(rows.length?rows[0].criado_em:Date.now());
  // monta últimos 14 dias com base na data mais recente disponível
  const ref = Object.keys(byDay).sort().pop() || new Date().toISOString().slice(0,10);
  const refDate=new Date(ref+"T00:00:00");
  for(let i=13;i>=0;i--){ const dt=new Date(refDate); dt.setDate(dt.getDate()-i); const key=dt.toISOString().slice(0,10); days.push([key,byDay[key]||0]); }
  const maxd=Math.max(1,...days.map(d=>d[1]));
  const chart=`<div class="days">${days.map(([k,v])=>`<div class="day">
    <div class="v">${v||""}</div><div class="b" style="height:${v/maxd*100}%"></div>
    <div class="n">${k.slice(8,10)}/${k.slice(5,7)}</div></div>`).join("")}</div>`;

  return `<div class="wrap">
    ${kpis}
    <div class="panel"><h3>Funil de vendas por etapa</h3>${funil}</div>
    <div class="panel"><h3>Prospecção nos últimos 14 dias</h3>${chart}</div>
  </div>`;
}

senha ? load() : login();
