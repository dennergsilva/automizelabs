<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex,nofollow" />
<title>Dashboard · Live Data Dupla 07/07 — Tráfego Pago</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;600&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0a0e17; --panel:#121926; --panel-2:#0f1520; --border:#1e2836;
    --ink:#eef2f8; --ink-soft:#9aa7bd; --ink-dim:#63718a;
    --blue:#3b82f6; --blue-soft:#1e40af; --amber:#f59e0b; --green:#22c55e; --red:#ef4444;
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:radial-gradient(1200px 600px at 70% -10%, #12203a 0%, var(--bg) 55%) fixed;
    color:var(--ink); font-family:'Fira Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased; min-height:100vh; padding:clamp(16px,3vw,40px);
  }
  .num{font-family:'Fira Code',ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;}
  .wrap{max-width:1180px;margin:0 auto;}

  header{display:flex;flex-wrap:wrap;align-items:center;gap:16px;justify-content:space-between;margin-bottom:28px;}
  .title h1{font-size:clamp(1.2rem,2.4vw,1.6rem);font-weight:700;letter-spacing:-.02em;}
  .title p{color:var(--ink-soft);font-size:.9rem;margin-top:4px;}
  .status{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .live{display:inline-flex;align-items:center;gap:8px;font-size:.82rem;color:var(--ink-soft);
    background:var(--panel);border:1px solid var(--border);padding:8px 14px;border-radius:999px;}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(34,197,94,.5);animation:pulse 2s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.45)}70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
  .btn{cursor:pointer;font-family:inherit;font-size:.82rem;color:var(--ink);background:var(--panel);
    border:1px solid var(--border);padding:9px 16px;border-radius:10px;transition:background .2s,border-color .2s;}
  .btn:hover{background:#1a2333;border-color:#33415a}
  .btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:14px;margin-bottom:26px;}
  .kpi{background:linear-gradient(180deg,var(--panel) 0%,var(--panel-2) 100%);border:1px solid var(--border);
    border-radius:var(--radius);padding:18px 18px 16px;position:relative;overflow:hidden;}
  .kpi::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--blue);opacity:.85;}
  .kpi.accent::before{background:var(--amber);}
  .kpi .label{display:flex;align-items:center;gap:8px;color:var(--ink-soft);font-size:.78rem;font-weight:500;text-transform:uppercase;letter-spacing:.04em;}
  .kpi .label svg{width:16px;height:16px;stroke:var(--ink-dim);flex:none;}
  .kpi .value{font-size:clamp(1.5rem,3.2vw,2rem);font-weight:600;margin-top:10px;letter-spacing:-.02em;}
  .kpi .sub{color:var(--ink-dim);font-size:.76rem;margin-top:4px;}

  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
  .card h2{font-size:1rem;font-weight:600;padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
  .card h2 svg{width:18px;height:18px;stroke:var(--blue);}
  .tablewrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;min-width:640px;}
  th,td{padding:13px 16px;text-align:right;font-size:.88rem;white-space:nowrap;}
  th{color:var(--ink-dim);font-weight:500;font-size:.74rem;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);}
  th:first-child,td:first-child{text-align:left;}
  tbody tr{border-bottom:1px solid rgba(30,40,54,.6);transition:background .15s;}
  tbody tr:last-child{border-bottom:none;}
  tbody tr:hover{background:#151d2b;}
  .adname{font-weight:500;color:var(--ink);}
  .adtype{display:inline-block;font-size:.66rem;padding:2px 7px;border-radius:6px;margin-right:8px;font-weight:600;letter-spacing:.03em;}
  .t-img{background:rgba(59,130,246,.15);color:#93b4ff;}
  .t-vid{background:rgba(245,158,11,.15);color:#fcd07a;}
  .cpl{color:var(--amber);font-weight:600;}
  .lead-val{color:var(--green);font-weight:600;}

  .state{padding:56px 20px;text-align:center;color:var(--ink-soft);}
  .state svg{width:42px;height:42px;stroke:var(--ink-dim);margin-bottom:14px;}
  .skeleton{background:linear-gradient(90deg,#141b28 25%,#1b2534 37%,#141b28 63%);background-size:400% 100%;animation:sh 1.4s ease infinite;border-radius:6px;color:transparent!important;}
  @keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}
  footer{margin-top:22px;text-align:center;color:var(--ink-dim);font-size:.76rem;}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title">
      <h1>Live Data Dupla 07/07 · Tráfego Pago</h1>
      <p>Campanha [CONVERSÃO] Grupo VIP — otimizando por Lead · dados desde o início</p>
    </div>
    <div class="status">
      <span class="live"><span class="dot" id="dot"></span><span id="updated">carregando…</span></span>
      <button class="btn" id="refresh" type="button">Atualizar agora</button>
    </div>
  </header>

  <section class="grid" id="kpis" aria-label="Indicadores principais">
    <!-- KPIs injetados -->
  </section>

  <section class="card">
    <h2>
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="10" width="3" height="7"/><rect x="12" y="6" width="3" height="11"/><rect x="17" y="13" width="3" height="4"/></svg>
      Desempenho por anúncio
    </h2>
    <div class="tablewrap">
      <table>
        <thead>
          <tr><th>Anúncio</th><th>Gasto</th><th>Leads</th><th>CPL</th><th>Cliques</th><th>CTR</th><th>CPM</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>

  <footer>Atualiza automaticamente a cada 60s · Meta pode ter alguns minutos de atraso na consolidação dos números</footer>
</div>

<script>
  var API = "https://n8n.automizelabs.com.br/webhook/dash-josi-live-data?k=k7Js2Live0707xQ9z";
  var REFRESH_MS = 60000;

  var fmtBRL = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
  var fmtInt = new Intl.NumberFormat('pt-BR');
  function brl(v){ return fmtBRL.format(Number(v)||0); }
  function int(v){ return fmtInt.format(Math.round(Number(v)||0)); }
  function pct(v){ return (Number(v)||0).toFixed(2).replace('.',',')+'%'; }

  function icon(name){
    var p = {
      spend:'<path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
      lead:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
      cpl:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
      click:'<path d="M9 9l5 12 1.8-5.2L21 14 9 9z"/><path d="M7.2 2.2l1 2.6M2.2 7.2l2.6 1M5 5l1.8 1.8"/>',
      ctr:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
      cpm:'<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 3v4M8 3v4M2 11h20"/>'
    };
    return '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+(p[name]||'')+'</svg>';
  }

  function kpiCard(label, value, ico, sub, accent){
    return '<div class="kpi'+(accent?' accent':'')+'">'
      + '<div class="label">'+icon(ico)+label+'</div>'
      + '<div class="value num">'+value+'</div>'
      + (sub?'<div class="sub">'+sub+'</div>':'')+'</div>';
  }

  function cleanName(n){ return String(n||'').replace(/^\[AD\]\s*/,''); }
  function typeTag(n){
    if(/\bVID\b|v[ií]deo/i.test(n)) return '<span class="adtype t-vid">VÍDEO</span>';
    if(/\bIMG\b/i.test(n)) return '<span class="adtype t-img">IMG</span>';
    return '';
  }

  function skeletonKPIs(){
    var labels=['Gasto','Leads','CPL','Cliques no link','CTR','CPM'];
    var icos=['spend','lead','cpl','click','ctr','cpm'];
    document.getElementById('kpis').innerHTML = labels.map(function(l,i){
      return kpiCard(l,'<span class="skeleton">0000</span>',icos[i],'',i===2);
    }).join('');
  }

  function render(d){
    var t = d.total||{};
    document.getElementById('kpis').innerHTML = [
      kpiCard('Gasto', brl(t.spend), 'spend', 'investido até agora'),
      kpiCard('Leads', int(t.leads), 'lead', 'entradas no Grupo VIP'),
      kpiCard('CPL', t.leads? brl(t.cpl):'—', 'cpl', 'custo por lead', true),
      kpiCard('Cliques no link', int(t.link_clicks), 'click', int(t.impressions)+' impressões'),
      kpiCard('CTR', pct(t.ctr), 'ctr', 'taxa de cliques'),
      kpiCard('CPM', brl(t.cpm), 'cpm', 'custo por mil impressões')
    ].join('');

    var rows = (d.ads||[]);
    var tb = document.getElementById('rows');
    if(!rows.length){
      tb.innerHTML = '<tr><td colspan="7"><div class="state">'
        + '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>'
        + '<div>Ainda sem dados de entrega. Os anúncios podem estar em análise — assim que começarem a rodar, os números aparecem aqui.</div></div></td></tr>';
      return;
    }
    tb.innerHTML = rows.map(function(a){
      return '<tr>'
        + '<td class="adname">'+typeTag(a.ad_name)+cleanName(a.ad_name)+'</td>'
        + '<td class="num">'+brl(a.spend)+'</td>'
        + '<td class="num lead-val">'+int(a.leads)+'</td>'
        + '<td class="num cpl">'+(a.leads?brl(a.cpl):'—')+'</td>'
        + '<td class="num">'+int(a.link_clicks)+'</td>'
        + '<td class="num">'+pct(a.ctr)+'</td>'
        + '<td class="num">'+brl(a.cpm)+'</td>'
      + '</tr>';
    }).join('');
  }

  function stamp(ok){
    var d = new Date();
    var hh = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
    document.getElementById('updated').textContent = (ok?'atualizado às ':'falha — última tentativa ')+hh;
    document.getElementById('dot').style.background = ok? 'var(--green)':'var(--red)';
  }

  var loading=false;
  function load(){
    if(loading) return; loading=true;
    fetch(API,{cache:'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(d){ if(d && d.ok){ render(d); stamp(true);} else { throw new Error('resp'); } })
      .catch(function(){ stamp(false); })
      .finally(function(){ loading=false; });
  }

  document.getElementById('refresh').addEventListener('click', load);
  skeletonKPIs();
  load();
  setInterval(load, REFRESH_MS);
</script>
</body>
</html>
