<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>OG Image source — AutomizeLabs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
    }
    body {
        font-family: 'Space Grotesk', system-ui, sans-serif;
        background: #050510;
        color: #e6fff5;
        position: relative;
        -webkit-font-smoothing: antialiased;
    }
    .bg-grid {
        position: absolute;
        inset: 0;
        background-image:
            linear-gradient(rgba(0,240,255,0.06) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0,240,255,0.06) 1px, transparent 1px);
        background-size: 60px 60px;
        z-index: 1;
    }
    .glow1 {
        position: absolute;
        width: 900px;
        height: 900px;
        left: -280px;
        top: -350px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(0,240,255,0.22), transparent 65%);
        z-index: 1;
    }
    .glow2 {
        position: absolute;
        width: 750px;
        height: 750px;
        right: -180px;
        bottom: -280px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(0,255,136,0.18), transparent 65%);
        z-index: 1;
    }
    .container {
        position: relative;
        z-index: 2;
        padding: 80px 90px;
        display: flex;
        flex-direction: column;
        height: 100%;
    }
    .logo {
        font-family: 'JetBrains Mono', monospace;
        font-size: 32px;
        font-weight: 700;
        color: #e6fff5;
        letter-spacing: 0.01em;
        margin-bottom: auto;
    }
    .logo-bracket { color: #00ff88; }
    .logo-dot { color: #00f0ff; }
    .tag {
        font-family: 'JetBrains Mono', monospace;
        font-size: 16px;
        color: #00f0ff;
        opacity: 0.8;
        margin-bottom: 16px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
    }
    .tag::before {
        content: '';
        width: 8px;
        height: 8px;
        background: #00ff88;
        border-radius: 50%;
        box-shadow: 0 0 12px #00ff88;
    }
    .headline {
        font-size: 96px;
        font-weight: 700;
        line-height: 1.02;
        letter-spacing: -0.025em;
        margin-bottom: 28px;
    }
    .mize {
        color: #00f0ff;
        text-shadow: 0 0 32px rgba(0, 240, 255, 0.55);
    }
    .sub {
        font-size: 26px;
        color: #a8b8cf;
        line-height: 1.35;
        max-width: 900px;
        font-weight: 400;
    }
    .sub strong {
        color: #e6fff5;
        font-weight: 600;
    }
    .sub .accent-green { color: #00ff88; font-weight: 600; }
    .sub .accent-cyan { color: #00f0ff; font-weight: 600; }
    .footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: auto;
        padding-top: 32px;
        border-top: 1px solid rgba(0, 240, 255, 0.15);
    }
    .stack {
        font-family: 'JetBrains Mono', monospace;
        font-size: 15px;
        color: #5a6a82;
        letter-spacing: 0.02em;
    }
    .stack span { color: #8a9bb3; }
    .url {
        font-family: 'JetBrains Mono', monospace;
        font-size: 18px;
        color: #00ff88;
        font-weight: 600;
        text-shadow: 0 0 12px rgba(0, 255, 136, 0.35);
    }
</style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="glow1"></div>
    <div class="glow2"></div>
    <div class="container">
        <div class="logo">
            <span class="logo-bracket">[</span>automize<span class="logo-dot">.</span>labs<span class="logo-bracket">]</span>
        </div>

        <div>
            <div class="tag">// system.online → ready</div>
            <h1 class="headline">Auto<span class="mize">mize</span><br>o que te consome.</h1>
            <p class="sub">Consultoria de <span class="accent-green">automação</span>, <span class="accent-cyan">IA aplicada</span> e <strong>integração de sistemas</strong> para empresas que querem escalar com inteligência.</p>
        </div>

        <div class="footer">
            <div class="stack">// <span>n8n</span> · <span>Python</span> · <span>Claude</span> · <span>OpenAI</span> · <span>Supabase</span> · <span>PostgreSQL</span></div>
            <div class="url">→ automizelabs.com.br</div>
        </div>
    </div>
</body>
</html>
